<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - CriptoExplorer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/newstyle.css') }}">
</head>
<body>
    <div class="wrapper">
        <nav class="navbar">
            <h1 class="logo">CriptoExplorer</h1>
        </nav>

        <section class="form-section">
            <div class="form-container">
                <h2>Crear Cuenta</h2>
                <form method="POST" action="{{ url_for('signin.signin') }}">
                    <label for="nombre_usuario">Nombre de Usuario</label>
                    <input type="text" id="nombre_usuario" name="nombre_usuario" placeholder="Elige un usuario" required>
                    
                    <label for="contraseña">Contraseña</label>
                    <input type="password" id="contraseña" name="contraseña" placeholder="Elige una contraseña" required>
                    
                    <button type="submit" class="btn">Registrarse</button>
                </form>
                <p>¿Ya tienes una cuenta? <a href="{{ url_for('login.login') }}">Inicia sesión aquí</a>.</p>
            </div>
        </section>
    </div>

    <footer>
        <p>&copy; 2024 NoLimits | Powered by CoinAPI</p>
    </footer>
</body>
</html>
